# Give Gradle 4 GB (instead of 6 GB, so OS + Android Studio have breathing room)
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m

# Parallel build + limit workers to CPU cores
org.gradle.parallel=true
org.gradle.workers.max=4

# Caching ON for faster rebuilds
org.gradle.caching=true

# AndroidX mandatory
android.useAndroidX=true

# Minor build optimizations
android.enableBuildConfigAsBytecode=true
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

